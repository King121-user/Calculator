<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css">

</head>

<body>
    <button id="theme" class="theme"><i class="fa-solid fa-sun"></i></button>
    <div class="calculate">
        <div class="screen">
            <span id="display">0</span>
        </div>
       <div class="rows">
        <div class="row1">
            <button id="clear" class="kng" onclick="reset()">AC</button>
            <button id="delete" class="kng" onclick="del()">DEL</button>
            <button id="percent" class="kng" onclick="selectOperator('%')">%</button>
            <button id="divide" class="mathsym" onclick="selectOperator('/')">/</button>
        </div>
        <div class="row2">
            <button id="seven" class="digits" onclick="appendNumber('7')">7</button>
            <button id="eight" class="digits" onclick="appendNumber('8')">8</button>
            <button id="nine" class="digits" onclick="appendNumber('9')">9</button>
            <button id="multiply" class="mathsym" onclick="selectOperator('*')">X</button>
        </div>
        <div class="row3">
            <button id="four" class="digits" onclick="appendNumber('4')">4</button>
            <button id="five" class="digits" onclick="appendNumber('5')">5</button>
            <button id="six" class="digits" onclick="appendNumber('6')">6</button>
            <button id="minus" class="mathsym" onclick="selectOperator('-')">-</button>
        </div>
        <div class="row4">
            <button id="one" class="digits" onclick="appendNumber('1')">1</button>
            <button id="two" class="digits" onclick="appendNumber('2')">2</button>
            <button id="three" class="digits" onclick="appendNumber('3')">3</button>
            <button id="plus" class="mathsym" onclick="selectOperator('+')">+</button>
        </div>
        <div class="row5">
            <button id="zero" class="digits" onclick="appendNumber('0')">0</button>
            <button id="zero2" class="digits" onclick="appendNumber('00')">00</button>
            <button id="dot" class="digits" onclick="appendNumber('.')">.</button>
            <button id="result" class="mathsym" title="Solve" onclick="calc()">=</button>
        </div>
       </div>
    </div>

</body>

</html>
