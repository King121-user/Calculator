<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css">

</head>

<body>
    <button id="theme" class="theme"><i class="fa-regular fa-moon"></i></button>
    <div class="calculate">
        <textarea name="caltxt" id="caltxt" cols="37" rows="1" title="Type"></textarea>
       <div class="rows">
        <div class="row1">
            <button id="clear" class="kng">AC</button>
            <button id="delete" class="kng">DEL</button>
            <button id="percent" class="kng">%</button>
            <button id="divide" class="mathsym">/</button>
        </div>
        <div class="row2">
            <button id="seven" class="digits">7</button>
            <button id="eight" class="digits">8</button>
            <button id="nine" class="digits">9</button>
            <button id="multiply" class="mathsym">X</button>
        </div>
        <div class="row3">
            <button id="four" class="digits">4</button>
            <button id="five" class="digits">5</button>
            <button id="six" class="digits">6</button>
            <button id="minus" class="mathsym">-</button>
        </div>
        <div class="row4">
            <button id="one" class="digits">1</button>
            <button id="two" class="digits">2</button>
            <button id="three" class="digits">3</button>
            <button id="plus" class="mathsym">+</button>
        </div>
        <div class="row5">
            <button id="zero" class="digits">0</button>
            <button id="zero2" class="digits">00</button>
            <button id="dot" class="digits">.</button>
            <button id="result" class="mathsym" title="Solve">=</button>
        </div>
       </div>
    </div>

</body>

</html>
